<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>michaelnegussie.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: #0a0e14;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/ashenafi_abebe.png');
      background-size: cover;
      background-position: center 30%;
      opacity: 0.82;
      filter: saturate(1.15);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(8,12,18,0.72) 100%);
    }

    .vignette-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(8,12,18,0.9) 0%, transparent 100%);
    }

    .top {
      position: relative;
      z-index: 2;
      padding: 2.5rem 3rem;
      display: flex;
      justify-content: flex-end;
    }

    .top-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 200;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
    }

    .bottom {
      position: relative;
      z-index: 2;
      padding: 3rem;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.0;
      color: rgba(255,255,255,0.95);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-family: 'Jost', sans-serif;
      font-size: 0.68rem;
      font-weight: 200;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2rem;
    }

    .nav {
      display: flex;
      gap: 2.5rem;
      list-style: none;
      flex-wrap: wrap;
    }

    .nav a {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav a:hover { color: rgba(255,255,255,0.95); }

    .credit {
      position: absolute;
      bottom: 3rem;
      right: 3rem;
      z-index: 2;
      font-family: 'Jost', sans-serif;
      font-size: 0.55rem;
      font-weight: 200;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: right;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .top { padding: 1.5rem; }
      .bottom { padding: 1.5rem; }
      .credit { right: 1.5rem; bottom: 1.5rem; }
      .nav { gap: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="bg"></div>
    <div class="vignette"></div>
    <div class="vignette-bottom"></div>

    <div class="top">
      <a class="top-label" href="index.html">michaelnegussie.com</a>
    </div>

    <div class="bottom">
      <h1 class="name">Michael Negussie</h1>
      <p class="subtitle">Scholar &amp; Social Entrepreneur</p>
      <ul class="nav">
        <li><a href="passions.html">Passions</a></li>
        <li><a href="foundations.html">Philosophy</a></li>
        <li><a href="blog/index.html">Writing</a></li>
        <li><a href="press.html">Coverage</a></li>
      </ul>
    </div>

    <div class="credit">
      Artwork — Ashenafi Abebe
    </div>
  </div>

</body>
</html>
